<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cortex</title>
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/brand.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  main { flex: 1; overflow-y: auto; }
  .chat-wrap { max-width: 820px; margin: 0 auto; padding: var(--ul-space-6); }
  .msg { margin-bottom: var(--ul-space-4); }
  .msg .who {
    font-family: var(--ul-font-display); font-size: var(--ul-text-xs);
    font-weight: 600; text-transform: uppercase; letter-spacing: var(--ul-track-label);
    color: var(--ul-faint); margin-bottom: var(--ul-space-1);
  }
  .msg.user .who { color: var(--ul-accent); }
  .msg .body { white-space: pre-wrap; color: var(--ul-body); }
  .msg.user .body { color: var(--ul-heading); }
  .toolline {
    font-family: var(--ul-font-mono); font-size: var(--ul-text-xs);
    color: var(--ul-muted); margin: var(--ul-space-1) 0;
  }
  .toolline .ok { color: var(--ul-up); }
  .toolline .er { color: var(--ul-down); }
  form.ask {
    border-top: 1px solid var(--ul-line); background: var(--ul-bg-raised);
    padding: var(--ul-space-4);
  }
  form.ask .row { max-width: 820px; margin: 0 auto; display: flex; gap: var(--ul-space-3); }
  form.ask input[type=text] {
    flex: 1; background: var(--ul-bg-inset); color: var(--ul-heading);
    border: 1px solid var(--ul-line-strong); border-radius: var(--ul-radius);
    padding: 0.7em 1em; font-family: var(--ul-font-body); font-size: var(--ul-text-base);
  }
  form.ask input[type=text]:focus { outline: 2px solid var(--ul-accent-dim); border-color: transparent; }
  .empty { color: var(--ul-faint); padding: var(--ul-space-12) 0; text-align: center; }
</style>
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <span class="brand"><img src="/assets/lockup-horizontal.svg" alt="Unchained Labs" style="height:22px"></span>
    <nav>
      <span class="mono" id="brainName"></span>
      <a href="#" id="newThread">new thread</a>
      <a href="https://unchained-labs.github.io/cortex/">docs</a>
    </nav>
  </div>
</header>

<main><div class="chat-wrap" id="log">
  <p class="empty">Ask your brain something. It searches your notes and sources before it answers.</p>
</div></main>

<form class="ask" id="ask">
  <div class="row">
    <input type="text" id="q" placeholder="Ask cortex…" autocomplete="off" autofocus>
    <button class="btn primary" type="submit">Send</button>
  </div>
</form>

<script>
const log = document.getElementById('log');
let thread = localStorage.getItem('cortex.thread') || '';
let key = localStorage.getItem('cortex.key') || '';

function el(cls, whoText) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + cls;
  const who = document.createElement('div');
  who.className = 'who'; who.textContent = whoText;
  const body = document.createElement('div');
  body.className = 'body';
  wrap.append(who, body);
  log.append(wrap);
  return body;
}

function toolLine(text, cls) {
  const div = document.createElement('div');
  div.className = 'toolline';
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text;
  div.append(span);
  log.append(div);
}

function headers() {
  const h = {'Content-Type': 'application/json'};
  if (key) h['Authorization'] = 'Bearer ' + key;
  return h;
}

async function info() {
  const res = await fetch('/api/info', {headers: headers()});
  if (res.status === 401) {
    key = prompt('This server requires a ctx_ key (cortex keys issue <name>):') || '';
    if (key) { localStorage.setItem('cortex.key', key); return info(); }
    return;
  }
  const data = await res.json();
  document.getElementById('brainName').textContent = data.brain + ' · ' + (data.chat_model || 'no model');
}

async function send(text) {
  const empty = log.querySelector('.empty');
  if (empty) empty.remove();
  el('user', 'you').textContent = text;
  let body = null;
  const res = await fetch('/api/chat', {
    method: 'POST', headers: headers(),
    body: JSON.stringify({message: text, thread})
  });
  if (res.status === 401) { localStorage.removeItem('cortex.key'); key=''; await info(); return; }
  if (!res.ok) { toolLine('request failed: HTTP ' + res.status, 'er'); return; }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += decoder.decode(value, {stream: true});
    const frames = buf.split('\n\n');
    buf = frames.pop();
    for (const frame of frames) {
      if (!frame.startsWith('data:')) continue;
      let ev;
      try { ev = JSON.parse(frame.slice(5)); } catch { continue; }
      if (ev.type === 'thread') { thread = ev.thread; localStorage.setItem('cortex.thread', thread); }
      else if (ev.type === 'token') { if (!body) body = el('brain', 'cortex'); body.textContent += ev.text; }
      else if (ev.type === 'tool_start') toolLine('⚙ ' + ev.name + ' ' + JSON.stringify(ev.arguments));
      else if (ev.type === 'tool_end') toolLine((ev.ok ? '✓ ' : '✗ ') + ev.name + ' (' + ev.latency_ms + 'ms)', ev.ok ? 'ok' : 'er');
      else if (ev.type === 'notice') toolLine('· ' + ev.text);
      else if (ev.type === 'error') toolLine('✗ ' + ev.text, 'er');
      else if (ev.type === 'done' && !body) { body = el('brain', 'cortex'); body.textContent = ev.text; }
      log.parentElement.scrollTop = log.parentElement.scrollHeight;
    }
  }
}

document.getElementById('ask').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('q');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send(text);
});

document.getElementById('newThread').addEventListener('click', (e) => {
  e.preventDefault();
  thread = '';
  localStorage.removeItem('cortex.thread');
  log.innerHTML = '<p class="empty">New thread.</p>';
});

info();
</script>
</body>
</html>
