name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web
      # The wheel ships the built dashboard, so a stale committed build would
      # release an old UI. Catch it on the PR, not at release time.
      - name: Fail if the committed dashboard is stale
        run: |
          if ! git diff --quiet -- src/cortex/server/webdist; then
            echo "::error::src/cortex/server/webdist differs from a fresh build."
            echo "Run 'cd web && npm run build' and commit the result."
            git diff --stat -- src/cortex/server/webdist
            exit 1
          fi
