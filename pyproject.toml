[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex-brain"
version = "0.2.0"
description = "A self-hosted brain for your home, your company, or any activity: pluggable local or cloud LLMs, hybrid memory, and an expandable plugin surface."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Unchained Labs" }]
keywords = ["agent", "assistant", "mcp", "rag", "self-hosted"]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "websockets>=13",
]

[project.urls]
Homepage = "https://unchained-labs.github.io/cortex/"
Repository = "https://github.com/Unchained-Labs/cortex"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
cortex = "cortex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends() in argument defaults is FastAPI's dependency-injection idiom.
"src/cortex/server/app.py" = ["B008"]
