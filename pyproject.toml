[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortxai"
version = "0.2.0"
description = "A self-hosted brain for your home, your company, or any activity: pluggable local or cloud LLMs, hybrid memory, and an expandable plugin surface."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Unchained Labs" }]
keywords = [
    "agent", "assistant", "mcp", "rag", "self-hosted", "langgraph",
    "obsidian", "knowledge-base", "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Office/Business :: Groupware",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "websockets>=13",
]

[project.urls]
Homepage = "https://unchained-labs.github.io/cortex/"
Documentation = "https://unchained-labs.github.io/cortex/"
Repository = "https://github.com/Unchained-Labs/cortex"
Changelog = "https://github.com/Unchained-Labs/cortex/blob/main/CHANGELOG.md"
Issues = "https://github.com/Unchained-Labs/cortex/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
cortex = "cortex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]
# The built dashboard ships in the wheel: `pip install cortxai` must serve a
# working UI without node. Hatch skips VCS-ignored files by default, and the
# repo ignores dist/ globally, so webdist is force-included here.
artifacts = ["src/cortex/server/webdist/**"]

[tool.hatch.build.targets.sdist]
include = [
    "src/cortex/**",
    "tests/**",
    "web/src/**",
    "web/package.json",
    "web/package-lock.json",
    "web/index.html",
    "web/vite.config.ts",
    "web/tsconfig.json",
    "docs/product-spec.md",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "install.sh",
    "Dockerfile",
    "docker-compose.yml",
]
artifacts = ["src/cortex/server/webdist/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends() in argument defaults is FastAPI's dependency-injection idiom.
"src/cortex/server/app.py" = ["B008"]
