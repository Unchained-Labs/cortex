name: cortex

services:
  cortex:
    build: .
    ports:
      # 127.0.0.1, not every interface. On most Docker setups a published port
      # bypasses the host firewall, and this one serves the household's notes.
      # To reach it from other machines, put a reverse proxy with TLS in front:
      # the session cookie is only marked `secure` on an https request.
      - "127.0.0.1:${CORTEX_PORT:-8642}:8642"
    volumes:
      # A named volume by default. Set CORTEX_BRAIN_DIR to a path instead if you
      # want the notes somewhere you can open with a text editor — which is most
      # of the point of a self-hosted brain.
      #
      # UPGRADING FROM A ROOT-ERA IMAGE: the image runs as uid 1000, and the
      # Dockerfile's `chown /brain` applies to the image layer only — a named
      # volume mounted over it keeps whatever ownership it was created with. A
      # volume created while the image still ran as root therefore stays
      # root-owned, and the first container recreated after the switch dies on
      # "attempt to write a readonly database" with correct-looking permissions
      # everywhere you would think to check. Fix once:
      #   docker compose down
      #   docker run --rm -u 0 -v cortex_brain:/b alpine chown -R 1000:1000 /b
      #   docker compose up -d
      - ${CORTEX_BRAIN_DIR:-brain}:/brain
      # Past agent sessions, READ-ONLY. They are 0600 on the host because they
      # contain every prompt typed and every file read on this machine; the
      # container runs as uid 1000, the same user that owns them, so it can read
      # them and nothing here can change them.
      #
      # Set CLAUDE_CONFIG_DIR to an ABSOLUTE path. Compose does not expand "~"
      # in a volume source — it creates a directory literally named "~" beside
      # this file and mounts that, so the tools would find no sessions and say
      # so rather than failing.
      - ${CLAUDE_CONFIG_DIR:-/home/jarvis/.claude}:/transcripts/.claude:ro
    # Tokens for the Code tab (GITHUB_TOKEN, GITLAB_TOKEN), a search backend
    # (CORTEX_SEARCH_URL or BRAVE_SEARCH_API_KEY) and any api_key_env in
    # cortex.yaml. Optional here because cortex also reads /brain/.env itself;
    # this one is for keeping secrets beside the compose file instead.
    env_file:
      - path: .env
        required: false
    environment:
      CORTEX_BRAIN: /brain
      # Where the transcript tools look. Absolute, because compose does not
      # expand "~" in an environment value any more than in a volume source.
      CLAUDE_CONFIG_DIR: /transcripts/.claude
      # Reach a model on the docker host with host.docker.internal
      # (works on Linux via the extra_hosts line below).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      default: {}
      # The shared ecosystem network, so agents can reach this brain by name.
      # The port above is bound to 127.0.0.1 on purpose — a household's notes
      # should not be on every interface — but that also puts it out of reach
      # of every container, because the host gateway cannot dial a loopback
      # binding. Joining the network is how a sibling container gets in
      # without opening the port to the world.
      #
      # Declared HERE rather than attached afterwards: `docker network connect`
      # does not survive the container being recreated, so the brain would
      # silently vanish from its consumers on every redeploy.
      ecosystem:
        aliases: [cortex]

volumes:
  brain:

networks:
  # Created by chezmoi's 60-up.sh; standalone: docker network create ecosystem
  ecosystem:
    external: true

# First run: create the brain inside the volume, then start.
#   docker compose run --rm cortex cortex setup /brain \
#     --non-interactive --kind custom \
#     --base-url http://host.docker.internal:11434/v1 \
#     --chat-model qwen3 --embed-model nomic-embed-text \
#     --admin-user you --admin-password 'change-me-now'
#   docker compose up -d
